name: Build Galaxy Watch 8 BakaSU boot

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: '原厂 boot 下载直链（.img / .img.lz4 / .img.gz）'
        required: true
        type: string
      source_urls:
        description: '源码包直链，用英文分号 ; 分隔，完整基础包在前，型号包/更新包依次在后'
        required: true
        type: string
      bakasu_repository:
        description: 'BakaSU 仓库（可选，owner/repo 或 HTTPS 地址；留空为 Baka-SU/BakaSU）'
        required: false
        type: string
      bakasu_ref:
        description: 'BakaSU commit / 分支 / tag（可选；留空为所选仓库默认分支最新提交）'
        required: false
        type: string
      unsigned:
        description: '不签名（不推荐）：仅输出 boot-unsign 镜像，保留三星尾部/模块证书，补零至原大小，不生成 AVB、LZ4 或 tar。未勾选时同时输出签名版和未签名版，并额外生成 boot.img.lz4 与单独的 AP.tar 工件；须在 Settings → Secrets and variables → Actions 的 Secrets 中添加 AVB_PRIVATE_KEY_B64，内容为 RSA-4096 私钥 PEM 的 Base64，缺失或无效会导致失败。'
        required: true
        default: false
        type: boolean
      toolchain_url:
        description: 'clang 工具链直链（可选；默认按源码 CLANG_VERSION 自动下载）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      WORK: /tmp/gw8-build
      DIST: ${{ github.workspace }}/dist/gw8
      PYTHONUNBUFFERED: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            dwarves cpio lz4 rsync unzip xz-utils zstd file curl git pkg-config \
            openssl ca-certificates gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 python3-cryptography python3-lz4 python3-pyelftools util-linux

      - name: Provide swap for kernel BTF on smaller runners
        run: |
          memory_kib=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
          swap_kib=$(awk '/SwapTotal:/ {print $2}' /proc/meminfo)
          if (( memory_kib < 12 * 1024 * 1024 && swap_kib < 4 * 1024 * 1024 )); then
            gw_swap_file="$RUNNER_TEMP/gw-build.swap"
            sudo fallocate -l 4G "$gw_swap_file"
            sudo chmod 600 "$gw_swap_file"
            sudo mkswap "$gw_swap_file"
            sudo swapon "$gw_swap_file"
          fi
          free -h

      - name: Validate inputs and signing setting
        env:
          BOOT_URL: ${{ inputs.boot_url }}
          SOURCE_URLS: ${{ inputs.source_urls }}
          UNSIGNED: ${{ inputs.unsigned }}
          AVB_PRIVATE_KEY_B64: ${{ secrets.AVB_PRIVATE_KEY_B64 }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from boot_image import decode_signing_key
          from pathlib import Path
          import tempfile
          if not os.environ['BOOT_URL'].strip() or not os.environ['SOURCE_URLS'].strip():
              raise SystemExit('请填写原 boot 和源码包下载链接')
          if os.environ['UNSIGNED'] != 'true':
              with tempfile.TemporaryDirectory() as folder:
                  decode_signing_key(os.environ['AVB_PRIVATE_KEY_B64'], Path(folder) / 'key.pem')
          PY

      - name: Download original boot and recover config / public module keys
        env:
          BOOT_URL: ${{ inputs.boot_url }}
        run: |
          python3 scripts/boot_image.py inspect --url "$BOOT_URL" --work "$WORK/stock"

      - name: Download and merge source archives in order
        env:
          SOURCE_URLS: ${{ inputs.source_urls }}
        run: |
          python3 scripts/gw8/source_archives.py \
            --output "$WORK/src" \
            --manifest "$WORK/source-manifest.json" \
            --downloads "$WORK/downloads"

      - name: Resolve BakaSU commit and prepare kernel / toolchain
        id: prepare
        env:
          BAKASU_REPOSITORY: ${{ inputs.bakasu_repository }}
          BAKASU_REF: ${{ inputs.bakasu_ref }}
          TOOLCHAIN_URL: ${{ inputs.toolchain_url }}
        run: |
          python3 scripts/gw8/prepare_kernel.py --work "$WORK"

      - name: Compile BakaSU Image and modules
        run: python3 scripts/gw8/compile_kernel.py --work "$WORK" --jobs "$(nproc)"

      - name: Package, sign and verify boot
        env:
          UNSIGNED: ${{ inputs.unsigned }}
          AVB_PRIVATE_KEY_B64: ${{ secrets.AVB_PRIVATE_KEY_B64 }}
        run: |
          pack_args=(
            --stock "$WORK/stock/stock-boot.img"
            --kernel "$WORK/out/arch/arm64/boot/Image"
          )
          if [[ "$UNSIGNED" == 'true' ]]; then
            pack_args+=(--unsigned)
          else
            python3 scripts/boot_image.py pack "${pack_args[@]}" --unsigned \
              --output "$WORK/boot-unsign.img" \
              --manifest "$WORK/boot-unsign-manifest.json"
          fi
          python3 scripts/boot_image.py pack "${pack_args[@]}" \
            --output "$WORK/boot.img" \
            --manifest "$WORK/boot-manifest.json"

      - name: Collect boot results / hashes
        id: results
        if: ${{ always() && !cancelled() }}
        run: python3 scripts/collect_results.py --work "$WORK" --output "$DIST" --ap-tar-output "$WORK/AP.tar"

      - name: Upload boot and public build reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ format('gw8_{0}', steps.results.outputs.artifact_name || format('build-reports-{0}', github.run_id)) }}
          path: dist/gw8/
          if-no-files-found: warn
          compression-level: 6

      - name: Upload separate AP.tar artifact
        if: ${{ always() && !cancelled() && steps.results.outputs.ap_tar == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AP.tar
          path: ${{ env.WORK }}/AP.tar
          if-no-files-found: error
          compression-level: 0
